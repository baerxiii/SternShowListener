<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stern Show Archive</title>

<style>

body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Segoe UI,sans-serif;
}

header{
    background:#0f172a;
    padding:20px;
    border-bottom:1px solid #334155;
}

h1{
    margin:0;
}

#search{
    margin-top:10px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
}

.container{
    display:flex;
    height:calc(100vh - 120px);
}

.sidebar{
    width:250px;
    background:#1e293b;
    overflow:auto;
}

.year{
    padding:15px;
    border-bottom:1px solid #334155;
    cursor:pointer;
}

.year:hover{
    background:#334155;
}

.main{
    flex:1;
    overflow:auto;
    padding:20px;
}

.episode{
    background:#1e293b;
    padding:12px;
    border-radius:8px;
    margin-bottom:8px;
    cursor:pointer;
}

.episode:hover{
    background:#334155;
}

.progress{
    font-size:12px;
    color:#4ade80;
}

.player{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#020617;
    padding:15px;
    border-top:1px solid #334155;
}

audio{
    width:100%;
}

button{
    padding:10px;
    margin:5px;
}

</style>
</head>

<body>

<header>

<h1>📻 Stern Show Archive</h1>

<input
id="search"
placeholder="Search Episodes..."
>

</header>

<div class="container">

<div class="sidebar">

<div class="year">1998</div>
<div class="year">1999</div>
<div class="year">2001</div>
<div class="year">2002</div>
<div class="year">2006</div>
<div class="year">2007</div>

</div>

<div class="main">

<h2>Continue Listening</h2>

<div id="continue"></div>

<h2>Episodes</h2>

<div id="episodes"></div>

</div>

</div>

<div class="player">

<div id="nowPlaying">
Nothing Playing
</div>

<audio
id="audio"
controls>
</audio>

<br>

<button onclick="skip(-30)">
⏪ 30s
</button>

<button onclick="skip(30)">
⏩ 30s
</button>

</div>

<script>

const sampleEpisodes=[

{
title:"1999-01-04_BOS_CF",
url:"https://drive.google.com/uc?export=download&id=1Rrm_NuH-ppWj2wixIeRvV3_CwGsEj4IS"
},

{
title:"1999-01-05_BOS_CF",
url:"https://drive.google.com/uc?export=download&id=1Rrm_NuH-ppWj2wixIeRvV3_CwGsEj4IS"
}

];

const audio=
document.getElementById("audio");

const list=
document.getElementById("episodes");

function render(){

list.innerHTML="";

sampleEpisodes.forEach(ep=>{

let saved=
localStorage.getItem(ep.title)||0;

let div=document.createElement("div");

div.className="episode";

div.innerHTML=
`
<strong>${ep.title}</strong>
<div class="progress">
Saved Position:
${Math.floor(saved/60)} min
</div>
`;

div.onclick=()=>play(ep);

list.appendChild(div);

});

}

function play(ep){

audio.src=ep.url;

document.getElementById(
"nowPlaying"
).innerText=ep.title;

audio.onloadedmetadata=()=>{

let pos=
localStorage.getItem(
ep.title
);

if(pos){

audio.currentTime=pos;

}

audio.play();

};

audio.ontimeupdate=()=>{

localStorage.setItem(
ep.title,
audio.currentTime
);

};

}

function skip(sec){

audio.currentTime+=sec;

}

render();

</script>

</body>
</html>
