<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stern Show Archive</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#111827;
font-family:Segoe UI,sans-serif;
color:white;
}

header{
background:#0f172a;
padding:20px;
border-bottom:1px solid #334155;
}

h1{
font-size:32px;
}

.search{
margin-top:10px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

.container{
display:grid;
grid-template-columns:250px 1fr;
height:calc(100vh - 90px);
}

.sidebar{
background:#1e293b;
overflow:auto;
padding:15px;
}

.year{
padding:12px;
margin-bottom:8px;
background:#334155;
border-radius:8px;
cursor:pointer;
transition:.2s;
}

.year:hover{
background:#475569;
}

.content{
padding:20px;
overflow:auto;
}

.card{
background:#1e293b;
padding:16px;
border-radius:12px;
margin-bottom:15px;
cursor:pointer;
}

.card:hover{
background:#334155;
}

.progress{
height:6px;
background:#0f172a;
border-radius:50px;
overflow:hidden;
margin-top:10px;
}

.progress-fill{
height:100%;
background:#22c55e;
width:0%;
}

#player{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#020617;
padding:15px;
border-top:1px solid #334155;
}

audio{
width:100%;
}

@media(max-width:768px){

.container{
grid-template-columns:1fr;
}

.sidebar{
display:flex;
overflow-x:auto;
white-space:nowrap;
}

.year{
display:inline-block;
margin-right:10px;
}

}
</style>
</head>

<body>

<header>

<h1>📻 Stern Show Archive</h1>

<input
class="search"
id="searchBox"
placeholder="Search all episodes..."
>

</header>

<div class="container">

<div class="sidebar">

<div class="year">1998</div>
<div class="year">1999</div>
<div class="year">2001</div>
<div class="year">2002</div>
<div class="year">2006</div>
<div class="year">2007</div>

</div>

<div class="content">

<h2>Continue Listening</h2>

<div id="continueListening"></div>

<h2 style="margin-top:25px;">
Episodes
</h2>

<div id="episodeList"></div>

</div>

</div>

<div id="player">

<div id="nowPlaying">
Nothing Playing
</div>

<audio id="audio" controls></audio>

</div>

</body>
</html>
