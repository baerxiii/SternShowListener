<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Stern Show Archive</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">

<meta name="theme-color" content="#111827">

</head>
<body>

<header>

<h1>📻 Stern Show Archive</h1>

<input
id="search"
placeholder="Search episodes..."
>

</header>

<div class="layout">

<aside id="years">

<button onclick="showYear('1998')">1998</button>
<button onclick="showYear('1999')">1999</button>
<button onclick="showYear('2001')">2001</button>
<button onclick="showYear('2002')">2002</button>
<button onclick="showYear('2006')">2006</button>
<button onclick="showYear('2007')">2007</button>

</aside>

<main>

<h2 id="yearTitle">
Select a Year
</h2>

<div id="episodeList"></div>

</main>

</div>

<div class="player">

<h3 id="nowPlaying">
Nothing Playing
</h3>

<iframe
id="playerFrame"
width="100%"
height="120"
allow="autoplay">
</iframe>

</div>

<script src="app.js"></script>

</body>
</html>
